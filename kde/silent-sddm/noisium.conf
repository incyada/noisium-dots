; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 1.25
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 75
padding-left = 75
background = "noisium.png"
use-background-color = false
background-color = "#000000"
blur = 0
brightness = 0.0
saturation = 0.0

[LockScreen.Clock]
display = true
position = "bottom-left"
align = "center"
format = "h:mm AP"
font-family = "Pixelify Sans"
font-size = 100
font-weight = 900
color = "#251b24"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "Pixelify Sans"
font-size = 20
font-weight = 600
color = "#251b24"
margin-top = -15

[LockScreen.Message]
display = false
position = "bottom-left"
align = "left"
text = "Press any key"
font-family = "Pixelify Sans"
font-size = 12
font-weight = 400
display-icon = false
icon = "enter.svg"
icon-size = 16
color = "#FFFFFF"
paint-icon = true
spacing = 0

[LoginScreen]
background = "noisium.png"
use-background-color = false
background-color = "#251b24"
blur = 64
brightness = -0.45
saturation = -0.3

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 0
inactive-border-size = 0
active-border-color = "#FFFFFF"
inactive-border-color = "#FFFFFF"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "Pixelify Sans"
font-size = 16
font-weight = 700
color = "#FFFFFF"
margin = 20

[LoginScreen.LoginArea.PasswordInput]
width = 200
height = 30
display-icon = true
font-family = "Pixelify Sans"
font-size = 12
icon = "password.svg"
icon-size = 16
content-color = "#251b24"
background-color = "#FFFFFF"
background-opacity = 0.6
border-size = 0
border-color = "#FFFFFF"
border-radius-left = 12
border-radius-right = 12
margin-top = 20
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#FFFFFF"
background-opacity = 0.6
active-background-color = "#FFFFFF"
active-background-opacity = 0.8
icon = "arrow-right.svg"
icon-size = 18
content-color = "#251b24"
active-content-color = "#251b24"
border-size = 0
border-color = "#FFFFFF"
border-radius-left = 12
border-radius-right = 12
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "Pixelify Sans"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "Pixelify Sans"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#FFFFFF"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "Pixelify Sans"
font-size = 11
font-weight = 400
normal-color = "#FFFFFF"
warning-color = "#FFFFFF"
error-color = "#FFFFFF"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 30
margin-bottom = 25
margin-left = 30
size = 45
border-radius = 12
spacing = 10
font-family = "Pixelify Sans"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = "#FFFFFF"
background-opacity = 0.15
active-option-background-color = "#FFFFFF"
active-option-background-opacity = 0.30
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
font-family = "Pixelify Sans"
border-size = 0
border-color = "#FFFFFF"
font-size = 11
icon-size = 18

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 200
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.30
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
border-size = 0
font-size = 10
icon-size = 24

[LoginScreen.MenuArea.Layout]
display = false
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.30
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 24

[LoginScreen.MenuArea.Keyboard]
display = false
position = "bottom-right"
index = 0
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.30
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
border-size = 0
icon = "keyboard.svg"
icon-size = 24

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.30
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
border-size = 0
icon = "power.svg"
icon-size = 24

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#FFFFFF"
background-opacity = 0.15
key-content-color = "#FFFFFF"
key-color = "#FFFFFF"
key-opacity = 0.15
key-active-background-color = "#FFFFFF"
key-active-opacity = 0.30
selection-background-color = "#CCCCCC"
selection-content-color = "#FFFFFF"
primary-color = "#FFF"
border-size = 0
border-color = "#000000"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "Pixelify Sans"
font-size = 11
content-color = "#FFFFFF"
background-color = "#FFFFFF"
background-opacity = 0.15
border-radius = 5
disable-user = false
disable-login-button = false
